name: Update @ohos-ports Package List

on:
  schedule:
    # 每天北京时间凌晨 2:00（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch: # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update packages.jsonl and README
        run: |
          set -ex
          export NPM_REGISTRY="https://registry.npmjs.org"
          python3 -u docs/update-packages.py

      - name: Commit and push if changed
        run: |
          set -ex
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/packages.jsonl docs/data/index.json README.md
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "auto: update @ohos-ports package list"
            git pull --rebase origin main
            git push
          fi
